<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Sorties 🐶</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="app">
      <!-- Header -->
      <header class="app-header">
        <div>
          <h1>🐾 Sorties</h1>
          <span id="header-author" class="header-author"></span>
        </div>
        <div class="header-actions">
          <select id="author-select" class="btn btn-sm" onchange="setAuthor(this.value)">
            <option value="michael">Michael</option>
            <option value="benjamin">Benjamin</option>
          </select>
          <button class="btn btn-icon" onclick="showStats()" title="Statistiques">📊</button>
        </div>
      </header>

      <!-- Today summary -->
      <section id="today-summary" class="card summary-card">
        <h2>Aujourd'hui <span id="today-date"></span></h2>
        <div class="summary-stats">
          <div class="stat"><span class="stat-num" id="today-total">0</span> sorties</div>
          <div class="stat"><span class="stat-num" id="today-walks">0</span> balades</div>
          <div class="stat"><span class="stat-num" id="today-pees">0</span> pipi</div>
          <div class="stat-poo"><span class="stat-num" id="today-poo">0</span> 💩</div>
          <div class="stat"><span class="stat-num" id="today-multi-pee">0</span> pipis</div>
          <div class="stat accident-stat"><span class="stat-num" id="today-accidents">0</span> 🚨</div>
        </div>
      </section>

      <!-- Walk form -->
      <section class="card form-card">
        <h2>Nouvelle sortie</h2>
        <form id="walk-form" autocomplete="off" onsubmit="return submitWalk(event)">
          <div class="form-row">
            <label class="form-label">Quand</label>
            <div class="form-inline">
              <input type="date" id="walk-date" required />
              <input type="time" id="walk-time" required />
            </div>
          </div>
          <div class="form-row">
            <label class="form-label">Durée (min)</label>
            <input type="number" id="walk-duration" min="0" max="999" placeholder="ex: 15" />
          </div>
          <div class="form-row">
            <label class="form-label">Auteur</label>
            <div class="radio-group" id="walk-author">
              <label class="radio-btn"><input type="radio" name="author" value="michael" checked /> Michael</label>
              <label class="radio-btn"><input type="radio" name="author" value="benjamin" /> Benjamin</label>
            </div>
          </div>
          <div class="form-row">
            <label class="form-label">Type</label>
            <div class="radio-group" id="walk-type">
              <label class="radio-btn"><input type="radio" name="type" value="walk" checked /> 🚶 Balade</label>
              <label class="radio-btn"><input type="radio" name="type" value="pee" /> 💦 Pipi</label>
            </div>
          </div>
          <div class="form-row">
            <label class="form-label">Caca ?</label>
            <div class="radio-group" id="poo-group">
              <label class="radio-btn"><input type="radio" name="poo" value="" checked /> Non</label>
              <label class="radio-btn"><input type="radio" name="poo" value="small" /> 🟢 Petit</label>
              <label class="radio-btn"><input type="radio" name="poo" value="medium" /> 🟡 Moyen</label>
              <label class="radio-btn"><input type="radio" name="poo" value="big" /> 🔴 Gros</label>
            </div>
          </div>
          <div class="form-row">
            <label class="form-label">Pipis (multi.)</label>
            <div id="pees-container">
              <div class="pee-row">
                <div class="radio-group" id="pee-size-row-0">
                  <label class="radio-btn"><input type="radio" name="pee-size-0" value="none" checked /> Non</label>
                  <label class="radio-btn"><input type="radio" name="pee-size-0" value="small" /> 🟢 Petit</label>
                  <label class="radio-btn"><input type="radio" name="pee-size-0" value="medium" /> 🟡 Moyen</label>
                  <label class="radio-btn"><input type="radio" name="pee-size-0" value="big" /> 🔴 Gros</label>
                </div>
                <button type="button" class="btn btn-sm btn-remove" onclick="removePeeRow(0)">✕</button>
              </div>
            </div>
            <button type="button" class="btn btn-sm add-pee-btn" onclick="addPeeRow()">+ Ajouter un pipi</button>
          </div>
          <div class="form-row">
            <label class="form-label" for="walk-note">Note</label>
            <textarea id="walk-note" rows="2" placeholder="Optionnel…"></textarea>
          </div>
          <div class="form-actions">
            <button type="submit" class="btn btn-primary">➕ Ajouter la sortie</button>
          </div>
        </form>
      </section>

      <!-- Accident form -->
      <section class="card form-card">
        <h2>🚨 Accident à l'intérieur</h2>
        <form id="accident-form" autocomplete="off" onsubmit="return submitAccident(event)">
          <div class="form-row">
            <label class="form-label">Quand</label>
            <div class="form-inline">
              <input type="date" id="accident-date" required />
              <input type="time" id="accident-time" required />
            </div>
          </div>
          <div class="form-row">
            <label class="form-label">Auteur</label>
            <div class="radio-group" id="accident-author">
              <label class="radio-btn"><input type="radio" name="acc-author" value="michael" checked /> Michael</label>
              <label class="radio-btn"><input type="radio" name="acc-author" value="benjamin" /> Benjamin</label>
            </div>
          </div>
          <div class="form-row">
            <label class="form-label">Taille du pipi</label>
            <div class="radio-group" id="accident-size">
              <label class="radio-btn"><input type="radio" name="acc-size" value="small" checked /> 🟢 Petit</label>
              <label class="radio-btn"><input type="radio" name="acc-size" value="medium" /> 🟡 Moyen</label>
              <label class="radio-btn"><input type="radio" name="acc-size" value="big" /> 🔴 Gros</label>
            </div>
          </div>
          <div class="form-row">
            <label class="form-label" for="accident-note">Note</label>
            <textarea id="accident-note" rows="2" placeholder="Ex: canapé"></textarea>
          </div>
          <div class="form-actions">
            <button type="submit" class="btn btn-primary" style="background:#c0392b">🚨 Enregistrer</button>
          </div>
        </form>
      </section>

      <!-- Walks list -->
      <section class="card list-card">
        <h2>Dernières sorties</h2>
        <div id="walks-list">
          <p class="empty-state">Aucune sortie enregistrée.</p>
        </div>
        <button id="load-more" class="btn btn-sm" onclick="loadMore()" style="display:none">Charger plus</button>
      </section>

      <!-- Accidents list -->
      <section class="card list-card">
        <h2>🚨 Derniers accidents</h2>
        <div id="accidents-list">
          <p class="empty-state">Aucun accident enregistré.</p>
        </div>
      </section>
    </div>

    <!-- Stats Modal -->
    <div id="stats-modal" class="modal-overlay" style="display:none" onclick="if(event.target===this)closeStats()">
      <div class="modal-content">
        <div class="modal-header">
          <h2>Statistiques</h2>
          <button class="btn btn-icon modal-close" onclick="closeStats()">✕</button>
        </div>
        <div class="modal-body" id="stats-body"><p>Chargement…</p></div>
      </div>
    </div>

    <!-- Edit Modal -->
    <div id="edit-modal" class="modal-overlay" style="display:none" onclick="if(event.target===this)closeEdit()">
      <div class="modal-content">
        <div class="modal-header">
          <h2>Modifier la sortie</h2>
          <button class="btn btn-icon modal-close" onclick="closeEdit()">✕</button>
        </div>
        <div class="modal-body" id="edit-body"><p>Chargement…</p></div>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
